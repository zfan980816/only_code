[lib]
name = "light_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package]
name = "light-reader"
version = "0.1.0"
description = "A lightweight, read-first local code reader."
authors = ["Light Reader contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8"
ignore = "0.4"
walkdir = "2"
tree-sitter = "0.24.7"
tree-sitter-language = "0.1"
tree-sitter-highlight = "0.24.7"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.23.6"
tree-sitter-java = "0.23.5"
once_cell = "1"
dirs = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true

